<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f85149"/>
      <stop offset="50%" style="stop-color:#f0883e"/>
      <stop offset="100%" style="stop-color:#d29922"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#f85149;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d29922;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#d29922;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>
    <filter id="textshadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f85149" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="320" rx="12" fill="url(#bg)"/>

  <circle cx="150" cy="160" r="180" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="750" cy="160" r="160" fill="url(#glow2)" filter="url(#blur2)"/>

  <g opacity="0.04" stroke="#f85149" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Error messages floating -->
  <g opacity="0.10">
    <text x="30" y="55" font-family="monospace" font-size="10" fill="#f85149">Error: EACCES permission denied</text>
    <text x="30" y="75" font-family="monospace" font-size="10" fill="#f85149">fatal: refusing to merge unrelated histories</text>
    <text x="30" y="95" font-family="monospace" font-size="10" fill="#f85149">OOMKilled: Container exceeded memory limit</text>
    <text x="30" y="115" font-family="monospace" font-size="10" fill="#f85149">CORS policy: No 'Access-Control-Allow-Origin'</text>
  </g>

  <g opacity="0.10">
    <text x="520" y="225" font-family="monospace" font-size="10" fill="#7ee787">$ decoded → Permission issue. Fix: change npm prefix</text>
    <text x="520" y="245" font-family="monospace" font-size="10" fill="#7ee787">$ decoded → Add --allow-unrelated-histories flag</text>
    <text x="520" y="265" font-family="monospace" font-size="10" fill="#7ee787">$ decoded → Increase memory limit or fix the leak</text>
    <text x="520" y="285" font-family="monospace" font-size="10" fill="#7ee787">$ decoded → Set Access-Control-Allow-Origin header</text>
  </g>

  <!-- Main title -->
  <text x="450" y="148" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="url(#accent)" filter="url(#textshadow)">
    error-messages-decoded
  </text>

  <!-- Subtitle -->
  <text x="450" y="188" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="17" fill="#8b949e">
    What your error actually means, why it happened, and how to fix it.
  </text>

  <rect x="310" y="202" width="280" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <rect x="0" y="316" width="900" height="4" rx="0" fill="url(#accent)" opacity="0.5"/>
</svg>
